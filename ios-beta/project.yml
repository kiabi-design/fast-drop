name: FastDrop

options:
  bundleIdPrefix: com.kiabi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  FastDropApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastDrop
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: FastDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.kiabi.fastdrop.beta
        INFOPLIST_FILE: FastDrop/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.2.0-beta"
        CURRENT_PROJECT_VERSION: "1"
