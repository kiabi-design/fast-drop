name: FastDrop
options:
  bundleIdPrefix: com.kiabi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  swiftVersion: "6.0"
  xcodeVersion: "26.6"

targets:
  FastDropCore:
    type: framework
    platform: iOS
    sources:
      - path: FastDrop
        excludes:
          - App
          - UI
    resources:
      - Metal/MetaballShader.metal
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: "YES"
      configs:
        Release:
          STRIP_SWIFT_SYMBOLS: "YES"
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  FastDropApp:
    type: application
    platform: iOS
    sources:
      - path: FastDrop/App
      - path: FastDrop/UI
    resources:
      - path: FastDrop/App/Resources
    dependencies:
      - target: FastDropCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_FILE: FastDrop/App/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kiabi.fastdrop.beta
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
      configs:
        Release:
          STRIP_SWIFT_SYMBOLS: "YES"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      testTargets: []

schemes:
  FastDropApp:
    build:
      targets:
        FastDropCore: all
        FastDropApp: all
    run:
      config: Release
    archive:
      config: Release