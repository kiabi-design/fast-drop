name: iOS Beta — Unsigned IPA for SideStore

on:
  push:
    branches: [beta/ios-native]
    paths:
      - 'ios-beta/**'
      - '.github/workflows/ios-beta.yml'
  pull_request:
    branches: [beta/ios-native]
    paths:
      - 'ios-beta/**'
      - '.github/workflows/ios-beta.yml'
  workflow_dispatch:

env:
  PROJECT_PATH: ios-beta
  SCHEME: FastDropApp
  BUNDLE_ID: com.kiabi.fastdrop.beta

jobs:
  build-ipa:
    name: Build Unsigned IPA (iPhone 15 Pro)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          # Find the latest Xcode automatically (by modification time, newest first)
          XCODE_PATH=$(ls -dt /Applications/Xcode*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ No Xcode found in /Applications"
            ls -la /Applications/
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          echo "✅ Selected: $XCODE_PATH"
          xcodebuild -version

      - name: Resolve SPM Dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: xcodebuild -resolvePackageDependencies -scheme ${{ env.SCHEME }}

      - name: Archive for Device (unsigned)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p ../build/Archive
          xcodebuild archive \
            -scheme ${{ env.SCHEME }} \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ../build/Archive/${{ env.SCHEME }}.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Export Unsigned IPA
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          cat > ../ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath ../build/Archive/${{ env.SCHEME }}.xcarchive \
            -exportPath ../build/Export \
            -exportOptionsPlist ../ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Verify IPA
        run: |
          IPA_PATH=$(find ../build/Export -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA not found"
            exit 1
          fi
          echo "✅ IPA found: $IPA_PATH"
          echo "Size: $(ls -lh "$IPA_PATH" | awk '{print $5}')"
          unzip -l "$IPA_PATH" | head -30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-Unsigned-IPA
          path: build/Export/*.ipa
          retention-days: 30

      - name: Upload dSYM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-dSYM
          path: build/Archive/${{ env.SCHEME }}.xcarchive/dSYMs/
          retention-days: 30