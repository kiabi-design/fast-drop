name: iOS Beta — Unsigned IPA for SideStore

on:
  push:
    branches: [beta/ios-native]
    paths:
      - 'ios-beta/**'
  pull_request:
    branches: [beta/ios-native]
    paths:
      - 'ios-beta/**'
  workflow_dispatch:

env:
  PROJECT_PATH: ios-beta
  SCHEME: FastDropApp
  BUNDLE_ID: com.kiabi.fastdrop.beta
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build Unsigned IPA (iPhone 15 Pro)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve SPM Dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: xcodebuild -resolvePackageDependencies -scheme ${{ env.SCHEME }}

      - name: Build for Simulator (verify compiles)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xcodebuild build \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Archive for Device (unsigned)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p ../build/Archive
          xcodebuild archive \
            -scheme ${{ env.SCHEME }} \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ../build/Archive/${{ env.SCHEME }}.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Export Unsigned IPA
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          cat > ../ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath ../build/Archive/${{ env.SCHEME }}.xcarchive \
            -exportPath ../build/Export \
            -exportOptionsPlist ../ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Verify IPA
        run: |
          IPA_PATH=$(find ../build/Export -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA not found"
            exit 1
          fi
          echo "✅ IPA found: $IPA_PATH"
          echo "Size: $(ls -lh "$IPA_PATH" | awk '{print $5}')"
          unzip -l "$IPA_PATH" | head -30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-Unsigned-IPA
          path: build/Export/*.ipa
          retention-days: 30

      - name: Upload dSYM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-dSYM
          path: build/Archive/${{ env.SCHEME }}.xcarchive/dSYMs/
          retention-days: 30

  # Optional: Build debug IPA for simulator testing
  build-simulator:
    name: Build Debug for Simulator
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Build Debug .app for Simulator
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xcodebuild build \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ../build/DerivedData \
            | xcbeautify

      - name: Zip .app for SideStore (simulator)
        run: |
          APP_PATH=$(find ../build/DerivedData -name "${{ env.SCHEME }}.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "${{ env.SCHEME }}-Simulator.zip" "$(basename "$APP_PATH")"
            echo "✅ Simulator .app zip created"
          fi

      - name: Upload Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-Simulator
          path: build/DerivedData/**/${{ env.SCHEME }}-Simulator.zip
          retention-days: 30