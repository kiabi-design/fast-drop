name: iOS Beta — Unsigned IPA for SideStore

on:
  push:
    branches: [beta/ios-native]
    paths:
      - 'ios-beta/**'
      - '.github/workflows/ios-beta.yml'
  pull_request:
    branches: [beta/ios-native]
    paths:
      - 'ios-beta/**'
      - '.github/workflows/ios-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: ios-beta
  SCHEME: FastDropApp
  BUNDLE_ID: com.kiabi.fastdrop.beta
  # Абсолютный путь: одинаков для ВСЕХ шагов, независимо от working-directory
  BUILD_DIR: ${{ github.workspace }}/build
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

defaults:
  run:
    # bash с pipefail: ошибка xcodebuild больше не прячется за `| xcbeautify`
    shell: bash

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install tools (XcodeGen, xcbeautify)
        run: |
          brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Archive for device (unsigned)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p "$BUILD_DIR/Archive"
          xcodebuild archive \
            -project FastDrop.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$BUILD_DIR/Archive/$SCHEME.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$BUILD_DIR/archive.log" \
            | xcbeautify

      # exportArchive для неподписанной сборки не работает (требует сертификат),
      # поэтому IPA собираем вручную: Payload/<App>.app -> zip.
      - name: Package unsigned IPA
        run: |
          shopt -s nullglob
          apps=("$BUILD_DIR/Archive/$SCHEME.xcarchive/Products/Applications"/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "❌ .app не найден внутри xcarchive"
            find "$BUILD_DIR/Archive" -maxdepth 5 | sort
            exit 1
          fi
          APP_PATH="${apps[0]}"
          echo "📦 App: $APP_PATH"

          rm -rf "$BUILD_DIR/Export"
          mkdir -p "$BUILD_DIR/Export/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Export/Payload/"
          cd "$BUILD_DIR/Export"
          zip -qry FastDrop-Beta-unsigned.ipa Payload
          rm -rf Payload

      - name: Verify IPA
        run: |
          shopt -s nullglob
          ipas=("$BUILD_DIR"/Export/*.ipa)
          if [ ${#ipas[@]} -eq 0 ]; then
            echo "❌ IPA not found in $BUILD_DIR/Export"
            find "$BUILD_DIR" -maxdepth 3 | sort
            exit 1
          fi
          IPA_PATH="${ipas[0]}"
          echo "✅ IPA found: $IPA_PATH"
          echo "Size: $(du -h "$IPA_PATH" | cut -f1)"

          # Без `unzip | head` — при pipefail head вызывает SIGPIPE (код 141)
          LISTING="$RUNNER_TEMP/ipa_listing.txt"
          unzip -l "$IPA_PATH" > "$LISTING"
          head -30 "$LISTING"

          grep -q "Payload/[^/]*\.app/Info\.plist" "$LISTING" \
            || { echo "❌ В IPA нет Info.plist"; exit 1; }
          grep -q "Payload/[^/]*\.app/default\.metallib" "$LISTING" \
            || { echo "❌ В IPA нет default.metallib (Metal-шейдеры не скомпилированы)"; exit 1; }

          TMP="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$TMP"
          apps=("$TMP"/Payload/*.app)
          APP="${apps[0]}"

          ACTUAL_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")"
          echo "Bundle ID: $ACTUAL_ID"
          [ "$ACTUAL_ID" = "$BUNDLE_ID" ] \
            || { echo "❌ Ожидался $BUNDLE_ID"; exit 1; }

          EXEC="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          ARCHS="$(lipo -archs "$APP/$EXEC")"
          echo "Архитектуры: $ARCHS"
          case " $ARCHS " in
            *" arm64 "*) ;;
            *) echo "❌ В бинарнике нет arm64"; exit 1 ;;
          esac

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-Unsigned-IPA
          path: build/Export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-dSYM
          path: build/Archive/${{ env.SCHEME }}.xcarchive/dSYMs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-Beta-build-log
          path: build/archive.log
          if-no-files-found: ignore
          retention-days: 7
