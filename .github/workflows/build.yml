name: Build APK and IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup custom files
        run: |
          mkdir -p /tmp/fast_drop_backup
          cp pubspec.yaml /tmp/fast_drop_backup/pubspec.yaml
          cp lib/main.dart /tmp/fast_drop_backup/main.dart
          cp scripts/patch_android.py /tmp/fast_drop_backup/patch_android.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android & iOS project
        run: |
          flutter create --org com.fastdrop --project-name fast_drop .
          cp /tmp/fast_drop_backup/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/fast_drop_backup/main.dart lib/main.dart
          python3 /tmp/fast_drop_backup/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r ../../FastDrop-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/FastDrop-unsigned.ipa
